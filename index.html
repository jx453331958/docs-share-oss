<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>文档分享中心</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }
        
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        /* 汉堡菜单按钮（仅手机显示） */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            color: #c9d1d9;
        }
        
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        
        .sidebar h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
            padding-bottom: 10px;
        }
        
        .doc-list {
            list-style: none;
        }
        
        .doc-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .doc-item:hover {
            background: #21262d;
        }
        
        .doc-item.active {
            background: #21262d;
            border-left-color: #58a6ff;
        }
        
        .doc-item-title {
            font-weight: 600;
            color: #c9d1d9;
            font-size: 14px;
        }
        
        .doc-item-desc {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 60px;
            background: #0d1117;
        }
        
        .markdown-body {
            max-width: 980px;
            margin: 0 auto;
        }
        
        .markdown-body h1 {
            font-size: 32px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #58a6ff;
        }
        
        .markdown-body h2 {
            font-size: 24px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
            margin-top: 40px;
            margin-bottom: 16px;
            color: #58a6ff;
        }
        
        .markdown-body h3 {
            font-size: 20px;
            margin-top: 24px;
            margin-bottom: 16px;
            color: #58a6ff;
        }
        
        .markdown-body h4 {
            font-size: 16px;
            margin-top: 24px;
            margin-bottom: 16px;
            color: #8b949e;
        }
        
        .markdown-body p {
            margin-bottom: 16px;
        }
        
        .markdown-body code {
            background: #161b22;
            padding: 3px 6px;
            border-radius: 3px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 85%;
            color: #79c0ff;
        }
        
        .markdown-body pre {
            background: #161b22;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            border: 1px solid #30363d;
        }
        
        .markdown-body pre code {
            background: none;
            padding: 0;
            color: #c9d1d9;
        }
        
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            display: block;
            overflow-x: auto;
        }
        
        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid #30363d;
            padding: 8px 12px;
            min-width: 100px;
        }
        
        .markdown-body table th {
            background: #161b22;
            font-weight: 600;
        }
        
        .markdown-body table tr:nth-child(even) {
            background: #0d1117;
        }
        
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 32px;
        }
        
        .markdown-body li {
            margin-bottom: 4px;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid #58a6ff;
            padding-left: 16px;
            color: #8b949e;
            margin-bottom: 16px;
        }
        
        .markdown-body a {
            color: #58a6ff;
            text-decoration: none;
        }
        
        .markdown-body a:hover {
            text-decoration: underline;
        }
        
        .markdown-body hr {
            border: none;
            border-top: 1px solid #21262d;
            margin: 24px 0;
        }
        
        /* 下载按钮 */
        .download-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
            gap: 8px;
        }

        .download-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #238636;
            color: #fff;
            border: 1px solid #2ea043;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .download-btn.visible {
            display: inline-flex;
        }

        .download-btn:hover {
            background: #2ea043;
        }

        .download-btn:active {
            background: #1a7f37;
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* 移动端遮罩层 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .sidebar-overlay.visible {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 2px 0 8px rgba(0,0,0,0.5);
            }

            .content {
                padding: 80px 16px 40px 16px;
            }

            .markdown-body {
                font-size: 14px;
            }

            .markdown-body h1 {
                font-size: 24px;
            }

            .markdown-body h2 {
                font-size: 20px;
            }

            .markdown-body h3 {
                font-size: 18px;
            }

            .markdown-body pre {
                font-size: 12px;
                padding: 12px;
            }

            .markdown-body table th,
            .markdown-body table td {
                padding: 6px 8px;
                font-size: 13px;
                min-width: 80px;
            }

            .download-btn {
                padding: 10px 18px;
                font-size: 15px;
                min-height: 44px;
            }

            .download-btn svg {
                width: 18px;
                height: 18px;
            }

            .download-bar {
                justify-content: center;
            }
        }
        
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 文档目录</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarOnMobile()"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <h1>📚 文档分享中心</h1>
            <ul class="doc-list" id="docList">
                <!-- 动态加载文档列表 -->
            </ul>
        </div>
        <div class="content">
            <div class="download-bar">
                <button class="download-btn" id="downloadBtn" onclick="downloadCurrentDoc()">
                    <svg viewBox="0 0 16 16"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14H2.75Zm6-6.22 1.72-1.72a.749.749 0 1 1 1.06 1.06l-3 3a.749.749 0 0 1-1.06 0l-3-3a.749.749 0 1 1 1.06-1.06l1.72 1.72V1.75a.75.75 0 0 1 1.5 0v5.28Z"/></svg>
                    下载文档
                </button>
            </div>
            <div class="markdown-body">
                <div class="loading">加载中</div>
            </div>
        </div>
    </div>

    <script>
        // 文档配置
        const docConfig = [
            {
                file: 'stock-analysis-2026-02-11.md',
                title: '📊 自选股分析 2026-02-11',
                desc: '技术面 · 消息面 · 15只自选股',
                path: './docs/'
            },
            {
                file: 'OPENCLAW_TECH_SHARE.md',
                title: '🐾 OpenClaw 技术分享',
                desc: 'AI Agent · Moltbook · 自动化',
                path: './docs/'
            }
        ];

        const docs = {};
        let currentDoc = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', isOpen);
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                sidebar.classList.remove('open');
                overlay.classList.remove('visible');
            }
        }

        async function loadMarkdown(filename, path) {
            const key = filename;
            if (!docs[key]) {
                try {
                    const response = await fetch(`${path}${filename}`);
                    if (!response.ok) throw new Error('文件不存在');
                    docs[key] = await response.text();
                } catch (error) {
                    throw new Error(`无法加载 ${filename}: ${error.message}`);
                }
            }
            return docs[key];
        }

        async function renderDoc(filename, path) {
            const container = document.querySelector('.markdown-body');
            const downloadBtn = document.getElementById('downloadBtn');
            container.innerHTML = '<div class="loading">加载中</div>';
            downloadBtn.classList.remove('visible');

            try {
                const markdown = await loadMarkdown(filename, path);
                container.innerHTML = marked.parse(markdown);
                currentDoc = { file: filename, path: path };
                downloadBtn.classList.add('visible');
                closeSidebarOnMobile();
            } catch (error) {
                container.innerHTML = `<p style="color: #f85149;">❌ ${error.message}</p>`;
                currentDoc = null;
            }
        }

        function downloadCurrentDoc() {
            if (!currentDoc) return;
            const content = docs[currentDoc.file];
            if (!content) return;

            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentDoc.file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function initDocList() {
            const docList = document.getElementById('docList');
            docList.innerHTML = '';

            docConfig.forEach((doc, index) => {
                const li = document.createElement('li');
                li.className = `doc-item ${index === 0 ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="doc-item-title">${doc.title}</div>
                    <div class="doc-item-desc">${doc.desc}</div>
                `;
                li.onclick = () => {
                    document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
                    li.classList.add('active');
                    renderDoc(doc.file, doc.path);
                };
                docList.appendChild(li);
            });
        }

        // 初始化
        initDocList();
        if (docConfig.length > 0) {
            renderDoc(docConfig[0].file, docConfig[0].path);
        }
    </script>
</body>
</html>
