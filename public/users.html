<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 · Docs Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080b10;
            --bg-surface: #0e1218;
            --bg-elevated: #151b24;
            --bg-hover: #1c2430;
            --border: rgba(99, 140, 255, 0.08);
            --border-active: rgba(99, 140, 255, 0.25);
            --accent: #638cff;
            --accent-glow: rgba(99, 140, 255, 0.15);
            --accent-dim: #3d5a9e;
            --text: #c8cfd8;
            --text-bright: #e8ecf0;
            --text-muted: #6b7a8d;
            --green: #34d399;
            --green-dim: #064e36;
            --red: #f47067;
            --red-dim: #4e1410;
            --orange: #ff9e64;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99,140,255,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -250px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(52,211,153,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 140, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 140, 255, 0.3); }
        * { scrollbar-width: thin; scrollbar-color: rgba(99,140,255,0.15) transparent; }

        /* Layout */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 32px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            margin-bottom: 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            flex-wrap: wrap;
        }

        .header-title {
            flex: 1;
            min-width: 280px;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 900;
            color: var(--text-bright);
            letter-spacing: -1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '👥';
            font-size: 0.8em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-elevated);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--border-active);
            background: var(--bg-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #5a7bdb 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 16px rgba(99, 140, 255, 0.2);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(99, 140, 255, 0.3);
            background: linear-gradient(135deg, #7499ff 0%, #6a8fe0 100%);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--green));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: var(--text-bright);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* User Grid */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .user-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .user-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at bottom right, rgba(99, 140, 255, 0.04), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .user-card:hover {
            border-color: var(--border-active);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .user-card:hover::after {
            opacity: 1;
        }

        .user-card.admin {
            border-color: rgba(255, 158, 100, 0.2);
            background: linear-gradient(135deg, var(--bg-surface) 0%, rgba(255, 158, 100, 0.03) 100%);
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 4px 12px rgba(99, 140, 255, 0.3);
        }

        .user-card.admin .user-avatar {
            background: linear-gradient(135deg, var(--orange), #ff7eb3);
            box-shadow: 0 4px 12px rgba(255, 158, 100, 0.3);
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-role {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-role.admin {
            background: rgba(255, 158, 100, 0.15);
            color: var(--orange);
            border: 1px solid rgba(255, 158, 100, 0.2);
        }

        .user-role.user {
            background: rgba(99, 140, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(99, 140, 255, 0.2);
        }

        .user-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .user-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 13px;
            padding: 8px 14px;
        }

        .btn-danger {
            background: var(--red-dim);
            color: var(--red);
            border-color: rgba(244, 112, 103, 0.2);
        }

        .btn-danger:hover {
            background: rgba(244, 112, 103, 0.15);
            border-color: rgba(244, 112, 103, 0.35);
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-active);
            border-radius: 16px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-hover);
            box-shadow: 0 0 0 3px rgba(99, 140, 255, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
        }

        .loading::before {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
        }

        .empty svg {
            width: 64px;
            height: 64px;
            fill: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-card {
            animation: fadeInUp 0.4s ease-out backwards;
        }

        .user-card:nth-child(1) { animation-delay: 0.05s; }
        .user-card:nth-child(2) { animation-delay: 0.1s; }
        .user-card:nth-child(3) { animation-delay: 0.15s; }
        .user-card:nth-child(4) { animation-delay: 0.2s; }
        .user-card:nth-child(5) { animation-delay: 0.25s; }
        .user-card:nth-child(6) { animation-delay: 0.3s; }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-active);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(6, 78, 54, 0.9);
        }

        .toast.error {
            border-color: rgba(244, 112, 103, 0.3);
            background: rgba(78, 20, 16, 0.9);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.8em;
            }

            .header {
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .header-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <h1>用户管理</h1>
                <p class="subtitle">管理文档站访问权限和用户账号</p>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="window.location.href='/'">
                    <svg viewBox="0 0 16 16"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>
                    返回文档
                </button>
                <button class="btn btn-primary" onclick="showAddUserModal()">
                    <svg viewBox="0 0 16 16"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
                    添加用户
                </button>
                <button class="btn btn-danger" onclick="handleLogout()">
                    <svg viewBox="0 0 16 16"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm9.22-1.03a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 0 1-1.06-1.06l1.72-1.72H6.75a.75.75 0 0 1 0-1.5h6.19l-1.72-1.72a.75.75 0 0 1 0-1.06Z"/></svg>
                    登出
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">总用户数</div>
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-desc">已注册用户账号</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">管理员</div>
                <div class="stat-value" id="adminCount">0</div>
                <div class="stat-desc">拥有管理权限</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">普通用户</div>
                <div class="stat-value" id="userCount">0</div>
                <div class="stat-desc">仅查看文档</div>
            </div>
        </div>

        <div id="usersContainer">
            <div class="loading">加载用户列表中...</div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">添加新用户</h2>
                <p class="modal-subtitle">新用户将拥有查看文档的权限</p>
            </div>
            <form id="addUserForm" onsubmit="handleAddUser(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" name="username" placeholder="输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" name="password" placeholder="输入密码" required minlength="6">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="hideAddUserModal()">取消</button>
                    <button type="submit" class="btn btn-primary">添加用户</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal" id="changePasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">修改密码</h2>
                <p class="modal-subtitle">为用户 <strong id="cpUsername"></strong> 设置新密码</p>
            </div>
            <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                <input type="hidden" name="targetUsername" id="cpTargetUsername">
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-input" name="newPassword" placeholder="输入新密码" required minlength="4">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-input" name="confirmPassword" placeholder="再次输入新密码" required minlength="4">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="hideChangePasswordModal()">取消</button>
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let users = [];

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Modal
        function showAddUserModal() {
            document.getElementById('addUserModal').classList.add('active');
        }

        function hideAddUserModal() {
            document.getElementById('addUserModal').classList.remove('active');
            document.getElementById('addUserForm').reset();
        }

        // Load users
        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '<div class="loading">加载用户列表中...</div>';

            try {
                const res = await fetch('/api/users');
                if (!res.ok) throw new Error('加载失败');

                users = await res.json();
                renderUsers();
            } catch (error) {
                container.innerHTML = `<div class="empty">
                    <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0zm9.78-2.22a.75.75 0 0 0-1.06-1.06L8 6.94 5.78 4.72a.75.75 0 0 0-1.06 1.06L6.94 8l-2.22 2.22a.75.75 0 1 0 1.06 1.06L8 9.06l2.22 2.22a.75.75 0 1 0 1.06-1.06L9.06 8l2.22-2.22z"/></svg>
                    <p>${error.message}</p>
                </div>`;
            }
        }

        // Render users
        function renderUsers() {
            const container = document.getElementById('usersContainer');

            if (users.length === 0) {
                container.innerHTML = '<div class="empty"><p>暂无用户</p></div>';
                updateStats();
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'users-grid';

            users.forEach(user => {
                const card = document.createElement('div');
                card.className = `user-card ${user.role}`;

                const initial = user.username.charAt(0).toUpperCase();
                const isAdmin = user.role === 'admin';

                card.innerHTML = `
                    <div class="user-header">
                        <div class="user-avatar">${initial}</div>
                        <div class="user-info">
                            <div class="user-name">${user.username}</div>
                            <span class="user-role ${user.role}">
                                ${isAdmin ? '👑 管理员' : '📄 普通用户'}
                            </span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn"
                                onclick="showChangePasswordModal('${user.username}')">
                            <svg viewBox="0 0 16 16"><path d="M8 1C5.2 1 3 3.2 3 6v1.5H2.25A1.25 1.25 0 0 0 1 8.75v5A1.25 1.25 0 0 0 2.25 15h11.5A1.25 1.25 0 0 0 15 13.75v-5A1.25 1.25 0 0 0 13.75 7.5H13V6c0-2.8-2.2-5-5-5zm3.5 6.5h-7V6a3.5 3.5 0 1 1 7 0v1.5zM8 10a1.25 1.25 0 0 1 .625 2.334V13a.625.625 0 0 1-1.25 0v-.666A1.25 1.25 0 0 1 8 10z"/></svg>
                            修改密码
                        </button>
                        <button class="btn btn-danger"
                                onclick="deleteUser('${user.username}')"
                                ${isAdmin ? 'disabled' : ''}>
                            <svg viewBox="0 0 16 16"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75zM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.575l-.66-6.6a.75.75 0 1 1 1.492-.15zM6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25z"/></svg>
                            ${isAdmin ? '无法删除' : '删除用户'}
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
            updateStats();
        }

        // Update stats
        function updateStats() {
            const total = users.length;
            const admins = users.filter(u => u.role === 'admin').length;
            const normalUsers = total - admins;

            document.getElementById('totalUsers').textContent = total;
            document.getElementById('adminCount').textContent = admins;
            document.getElementById('userCount').textContent = normalUsers;
        }

        // Add user
        async function handleAddUser(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const username = formData.get('username');
            const password = formData.get('password');

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || '添加失败');
                }

                showToast(`用户 ${username} 添加成功`);
                hideAddUserModal();
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Delete user
        async function deleteUser(username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？\n\n此操作无法撤销。`)) {
                return;
            }

            try {
                const res = await fetch(`/api/users/${encodeURIComponent(username)}`, {
                    method: 'DELETE',
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || '删除失败');
                }

                showToast(`用户 ${username} 已删除`);
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Change password modal
        function showChangePasswordModal(username) {
            document.getElementById('cpUsername').textContent = username;
            document.getElementById('cpTargetUsername').value = username;
            document.getElementById('changePasswordModal').classList.add('active');
        }

        function hideChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.remove('active');
            document.getElementById('changePasswordForm').reset();
        }

        async function handleChangePassword(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const targetUsername = formData.get('targetUsername');
            const newPassword = formData.get('newPassword');
            const confirmPassword = formData.get('confirmPassword');

            if (newPassword !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/users/${encodeURIComponent(targetUsername)}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword }),
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || '修改失败');
                }

                showToast(`用户 ${targetUsername} 的密码已修改`);
                hideChangePasswordModal();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Logout
        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch {}
            window.location.href = '/login';
        }

        // Close modal on click outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('active');
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideAddUserModal();
                hideChangePasswordModal();
            }
        });

        // Init
        loadUsers();
    </script>
</body>
</html>
