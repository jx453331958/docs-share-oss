<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>文档分享中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-deep: #080b10;
            --bg-surface: #0e1218;
            --bg-elevated: #151b24;
            --bg-hover: #1c2430;
            --border: rgba(99, 140, 255, 0.08);
            --border-active: rgba(99, 140, 255, 0.25);
            --accent: #638cff;
            --accent-glow: rgba(99, 140, 255, 0.15);
            --accent-dim: #3d5a9e;
            --text: #c8cfd8;
            --text-bright: #e8ecf0;
            --text-muted: #6b7a8d;
            --green: #34d399;
            --green-dim: #064e36;
            --sidebar-w: 280px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 140, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 140, 255, 0.3); }
        * { scrollbar-width: thin; scrollbar-color: rgba(99,140,255,0.15) transparent; }

        /* ── Layout ── */
        .container { display: flex; height: 100vh; position: relative; }

        /* ── Mobile hamburger ── */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
        }
        .menu-toggle:hover { border-color: var(--border-active); }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: width var(--transition), padding var(--transition);
            flex-shrink: 0;
            position: relative;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right-color: transparent;
        }

        /* ── Sidebar toggle (outside sidebar via container positioning) ── */
        .sidebar-toggle-wrap {
            position: absolute;
            top: 50%;
            left: var(--sidebar-w);
            transform: translateY(-50%);
            z-index: 20;
            transition: left var(--transition);
        }

        .sidebar-toggle-wrap.collapsed { left: 0; }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 48px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11px;
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            color: var(--accent);
            background: var(--bg-hover);
            border-color: var(--border-active);
        }

        .sidebar h1 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-bright);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar h1 span { color: var(--accent); }

        .user-menu-btn {
            padding: 6px 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .user-menu-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--bg-hover);
        }

        .user-menu-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* ── Search & Controls ── */
        .sidebar-controls {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 32px 8px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: none;
            transition: color 0.2s;
        }

        .search-clear.visible {
            display: block;
        }

        .search-clear:hover {
            color: var(--accent);
        }

        .refresh-btn {
            padding: 8px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            color: var(--accent);
        }

        .refresh-btn.is-refreshing {
            pointer-events: none;
        }

        .refresh-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .refresh-btn.is-refreshing svg {
            animation: spin 1s linear infinite;
        }

        .doc-count {
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .doc-list { list-style: none; }

        .doc-item {
            padding: 10px 14px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s, border-color 0.2s;
            border-left: 2px solid transparent;
            position: relative;
        }

        .doc-item:hover { background: var(--bg-hover); }

        .doc-item.active {
            background: var(--accent-glow);
            border-left-color: var(--accent);
        }

        .doc-item-title {
            font-weight: 500;
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-item.active .doc-item-title { color: var(--text-bright); }

        .doc-item-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            opacity: 0.65;
            font-variant-numeric: tabular-nums;
        }

        /* ── Sort Bar ── */
        .sort-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .sort-btn {
            flex: 1;
            padding: 4px 0;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            white-space: nowrap;
        }
        .sort-btn:hover {
            border-color: var(--border-active);
            color: var(--text);
            background: var(--bg-hover);
        }
        .sort-btn.active {
            background: var(--accent-glow);
            border-color: rgba(99, 140, 255, 0.3);
            color: var(--accent);
        }
        .sort-arrow { font-size: 10px; }

        /* ── Drag and Drop ── */
        .doc-item[draggable="true"] { cursor: grab; }
        .doc-item.dragging { opacity: 0.4; }
        .doc-item.drag-over-top { box-shadow: 0 -2px 0 0 var(--accent); }
        .doc-item.drag-over-bottom { box-shadow: 0 2px 0 0 var(--accent); }

        /* ── Lazy Load Sentinel ── */
        .load-sentinel {
            padding: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            opacity: 0.5;
        }

        /* ── Content ── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 48px 64px;
            background: var(--bg-deep);
            position: relative;
        }

        /* subtle gradient glow at top */
        .content::before {
            content: '';
            position: fixed;
            top: -120px;
            right: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99,140,255,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .markdown-body {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Typography ── */
        .markdown-body h1 {
            font-size: 2em;
            font-weight: 900;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 8px;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            position: relative;
        }
        .markdown-body h1::after {
            content: '';
            display: block;
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: 700;
            border-bottom: none;
            margin-top: 48px;
            margin-bottom: 16px;
            color: var(--text-bright);
            letter-spacing: -0.3px;
        }

        .markdown-body h3 {
            font-size: 1.15em;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .markdown-body h4 {
            font-size: 1em;
            font-weight: 500;
            margin-top: 24px;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.85em;
        }

        .markdown-body p { margin-bottom: 16px; color: var(--text); }

        .markdown-body strong { color: var(--text-bright); font-weight: 600; }

        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }

        /* ── Code ── */
        .markdown-body code {
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            background: var(--bg-elevated);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #a5d6ff;
            border: 1px solid var(--border);
        }

        .markdown-body pre {
            background: var(--bg-surface);
            padding: 20px 24px;
            border-radius: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: var(--text);
            border: none;
            font-size: 0.85em;
            line-height: 1.6;
        }

        /* ── Table ── */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            display: block;
            overflow-x: auto;
            border-radius: 8px;
        }

        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            min-width: 100px;
            font-size: 0.9em;
        }

        .markdown-body table th {
            background: var(--bg-elevated);
            font-weight: 600;
            color: var(--text-bright);
            text-align: left;
        }

        .markdown-body table tr:hover td {
            background: rgba(99, 140, 255, 0.03);
        }

        /* ── Lists ── */
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 28px;
        }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body li::marker { color: var(--accent-dim); }

        /* ── Blockquote ── */
        .markdown-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 12px 20px;
            color: var(--text-muted);
            margin-bottom: 16px;
            background: var(--accent-glow);
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* ── Download ── */
        .download-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .download-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .download-btn.visible { display: inline-flex; }
        .download-btn:hover { background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.35); }

        .download-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

        /* ── Overlay ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .sidebar-overlay.visible { display: block; }

        /* ── Loading ── */
        .loading {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loading::before {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Fade-in ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .markdown-body { animation: fadeUp 0.25s ease-out; }
        @media (max-width: 768px) {
            .markdown-body { animation: fadeUp 0.15s ease-out; }
        }
        @media (prefers-reduced-motion: reduce) {
            .markdown-body { animation: none; }
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }

            .sidebar-toggle-wrap { display: none !important; }

            .sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                width: 80% !important; max-width: 280px;
                padding: 20px !important;
                border-right: 1px solid var(--border) !important;
                overflow: auto !important;
                overscroll-behavior: contain;
            }
            .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.5); }

            .content { padding: 80px 16px 40px; }
            .markdown-body { font-size: 14px; }
            .markdown-body h1 { font-size: 1.6em; }
            .markdown-body h2 { font-size: 1.3em; }
            .markdown-body pre { padding: 14px; font-size: 12px; }
            .markdown-body table th, .markdown-body table td { padding: 6px 8px; font-size: 13px; min-width: 80px; }
            .download-btn { padding: 10px 18px; font-size: 15px; min-height: 44px; }
            .download-bar { justify-content: center; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 文档</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarOnMobile()"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <h1>
                <span>◆</span> 文档中心
                <span class="doc-count" id="docCount">0</span>
            </h1>

            <div class="sidebar-controls">
                <div class="search-box">
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="搜索文档..."
                        autocomplete="off"
                    >
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button class="user-menu-btn" onclick="window.location.href='/users.html'" title="用户管理">
                        <svg viewBox="0 0 16 16"><path d="M10.5 5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm.061 3.073a4 4 0 1 0-5.123 0 6.004 6.004 0 0 0-3.431 5.142.75.75 0 0 0 1.498.07 4.5 4.5 0 0 1 8.99 0 .75.75 0 0 0 1.498-.07 6.005 6.005 0 0 0-3.432-5.142Z"/></svg>
                        管理
                    </button>
                    <button class="user-menu-btn" onclick="handleLogout()" title="登出" id="logoutBtn" style="display: none;">
                        <svg viewBox="0 0 16 16"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm9.22-1.03a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 0 1-1.06-1.06l1.72-1.72H6.75a.75.75 0 0 1 0-1.5h6.19l-1.72-1.72a.75.75 0 0 1 0-1.06Z"/></svg>
                        登出
                    </button>
                    <button class="refresh-btn" id="refreshBtn" onclick="refreshDocs()" style="flex: 1;">
                        <svg viewBox="0 0 16 16"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
                        刷新
                    </button>
                </div>
            </div>

            <div class="sort-bar">
                <button class="sort-btn active" data-sort="time">时间 <span class="sort-arrow">↓</span></button>
                <button class="sort-btn" data-sort="title">标题 <span class="sort-arrow">↑</span></button>
                <button class="sort-btn" data-sort="custom">自定义</button>
            </div>

            <ul class="doc-list" id="docList"></ul>
            <div id="loadSentinel" class="load-sentinel" style="display:none;">加载更多...</div>
        </div>

        <div class="sidebar-toggle-wrap" id="sidebarToggleWrap">
            <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebarDesktop()" title="收起/展开侧边栏">◂</button>
        </div>

        <div class="content">
            <div class="download-bar">
                <button class="download-btn" id="downloadBtn" onclick="downloadCurrentDoc()">
                    <svg viewBox="0 0 16 16"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14H2.75Zm6-6.22 1.72-1.72a.749.749 0 1 1 1.06 1.06l-3 3a.749.749 0 0 1-1.06 0l-3-3a.749.749 0 1 1 1.06-1.06l1.72 1.72V1.75a.75.75 0 0 1 1.5 0v5.28Z"/></svg>
                    下载
                </button>
            </div>
            <div class="markdown-body">
                <div class="loading">加载中</div>
            </div>
        </div>
    </div>

    <script>
        // ── State ──
        let docConfig = [];
        let sortedDocs = [];
        const docs = {};
        let currentDoc = null;
        let searchQuery = '';
        let currentSort = localStorage.getItem('docs-sort-mode') || 'time-desc';
        let displayedCount = 0;
        const PAGE_SIZE = 50;
        let lazyObserver = null;
        let dragSrcEl = null;

        // ── Sidebar ──
        function toggleSidebarDesktop() {
            const sidebar = document.getElementById('sidebar');
            const wrap = document.getElementById('sidebarToggleWrap');
            const toggle = document.getElementById('sidebarToggle');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            wrap.classList.toggle('collapsed', isCollapsed);
            toggle.textContent = isCollapsed ? '▸' : '◂';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', isOpen);
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('visible');
            }
        }

        // ── Markdown Rendering ──
        async function loadMarkdown(filename, path) {
            if (!docs[filename]) {
                const response = await fetch(`${path}${filename}`);
                if (!response.ok) throw new Error('文件不存在');
                docs[filename] = await response.text();
            }
            return docs[filename];
        }

        async function renderDoc(filename, path) {
            const container = document.querySelector('.markdown-body');
            const downloadBtn = document.getElementById('downloadBtn');
            container.innerHTML = '<div class="loading">加载中</div>';
            downloadBtn.classList.remove('visible');
            try {
                const markdown = await loadMarkdown(filename, path);
                container.innerHTML = marked.parse(markdown);
                container.style.animation = 'none';
                container.offsetHeight;
                container.style.animation = '';
                currentDoc = { file: filename, path: path };
                downloadBtn.classList.add('visible');
                closeSidebarOnMobile();
                document.querySelector('.content').scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                container.innerHTML = `<p style="color: #f47067;">${error.message}</p>`;
                currentDoc = null;
            }
        }

        function downloadCurrentDoc() {
            if (!currentDoc || !docs[currentDoc.file]) return;
            const blob = new Blob([docs[currentDoc.file]], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentDoc.file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ── Time Formatting (browser local timezone) ──
        function formatTime(mtimeMs) {
            if (!mtimeMs) return '';
            const now = Date.now();
            const diff = now - mtimeMs;
            if (diff < 0) return '刚刚';
            const mins = Math.floor(diff / 60000);
            const hours = Math.floor(mins / 60);
            const days = Math.floor(hours / 24);
            if (mins < 1) return '刚刚';
            if (mins < 60) return `${mins} 分钟前`;
            if (hours < 24) return `${hours} 小时前`;
            if (days < 30) return `${days} 天前`;
            const d = new Date(mtimeMs);
            const sameYear = d.getFullYear() === new Date().getFullYear();
            return d.toLocaleDateString(undefined, sameYear
                ? { month: '2-digit', day: '2-digit' }
                : { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        // ── Sort Logic ──
        function getCustomOrder() {
            try { return JSON.parse(localStorage.getItem('docs-custom-order') || '[]'); }
            catch { return []; }
        }

        function saveCustomOrder(order) {
            localStorage.setItem('docs-custom-order', JSON.stringify(order));
        }

        function sortDocs(arr) {
            const sorted = [...arr];
            switch (currentSort) {
                case 'time-desc': sorted.sort((a, b) => b.mtime - a.mtime); break;
                case 'time-asc': sorted.sort((a, b) => a.mtime - b.mtime); break;
                case 'title-asc': sorted.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN')); break;
                case 'title-desc': sorted.sort((a, b) => b.title.localeCompare(a.title, 'zh-CN')); break;
                case 'custom': {
                    const order = getCustomOrder();
                    if (order.length) {
                        const m = new Map(order.map((f, i) => [f, i]));
                        sorted.sort((a, b) => {
                            const ai = m.has(a.file) ? m.get(a.file) : 9999999;
                            const bi = m.has(b.file) ? m.get(b.file) : 9999999;
                            return ai === bi ? b.mtime - a.mtime : ai - bi;
                        });
                    }
                    break;
                }
            }
            return sorted;
        }

        // ── Sort UI ──
        function initSortBar() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const s = btn.dataset.sort;
                    if (s === 'time') {
                        currentSort = currentSort === 'time-desc' ? 'time-asc' : 'time-desc';
                    } else if (s === 'title') {
                        currentSort = currentSort === 'title-asc' ? 'title-desc' : 'title-asc';
                    } else {
                        currentSort = 'custom';
                        if (!getCustomOrder().length) {
                            saveCustomOrder(sortedDocs.map(d => d.file));
                        }
                    }
                    localStorage.setItem('docs-sort-mode', currentSort);
                    updateSortButtons();
                    applySortAndRender();
                });
            });
            updateSortButtons();
        }

        function updateSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                const s = btn.dataset.sort;
                let active = false;
                if (s === 'time') {
                    active = currentSort.startsWith('time');
                    const arrow = btn.querySelector('.sort-arrow');
                    if (arrow) arrow.textContent = currentSort === 'time-asc' ? '↑' : '↓';
                } else if (s === 'title') {
                    active = currentSort.startsWith('title');
                    const arrow = btn.querySelector('.sort-arrow');
                    if (arrow) arrow.textContent = currentSort === 'title-desc' ? '↓' : '↑';
                } else {
                    active = currentSort === 'custom';
                }
                btn.classList.toggle('active', active);
            });
        }

        function applySortAndRender() {
            const source = searchQuery
                ? docConfig.filter(d => d.title.toLowerCase().includes(searchQuery) || d.file.toLowerCase().includes(searchQuery))
                : docConfig;
            sortedDocs = sortDocs(source);
            displayedCount = 0;
            renderDocList();
        }

        // ── Search ──
        function filterDocs(query) {
            searchQuery = query.toLowerCase().trim();
            applySortAndRender();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('visible');
            filterDocs('');
        }

        function updateDocCount() {
            const el = document.getElementById('docCount');
            if (searchQuery) {
                el.textContent = `${sortedDocs.length}/${docConfig.length}`;
            } else {
                el.textContent = docConfig.length;
            }
        }

        // ── Refresh ──
        async function refreshDocs() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('is-refreshing');
            try {
                const res = await fetch('/api/docs?t=' + Date.now());
                const list = await res.json();
                docConfig = list.map(d => ({ file: d.file, title: d.title, mtime: d.mtime, path: './' }));
                applySortAndRender();
            } catch (e) {
                console.error('Failed to refresh:', e);
            } finally {
                btn.classList.remove('is-refreshing');
            }
        }

        // ── Lazy Doc List Rendering ──
        function renderDocList() {
            const docList = document.getElementById('docList');
            const sidebar = document.getElementById('sidebar');
            const scrollTop = sidebar.scrollTop;

            // 锁定列表高度，防止替换期间高度塌缩导致抖动
            const prevHeight = docList.offsetHeight;
            docList.style.minHeight = prevHeight + 'px';

            displayedCount = 0;

            if (sortedDocs.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;';
                empty.textContent = searchQuery ? '未找到匹配的文档' : '暂无文档';
                docList.replaceChildren(empty);
                docList.style.minHeight = '';
                updateDocCount();
                document.getElementById('loadSentinel').style.display = 'none';
                return;
            }

            loadMoreDocs(true);
            sidebar.scrollTop = scrollTop;
            docList.style.minHeight = '';
            updateDocCount();
            setupLazyLoad();
        }

        function buildDocItems(start, end) {
            const frag = document.createDocumentFragment();
            const canDrag = !searchQuery && currentSort === 'custom';

            for (let i = start; i < end; i++) {
                const doc = sortedDocs[i];
                const li = document.createElement('li');
                li.className = 'doc-item';
                li.dataset.file = doc.file;

                if (i === 0 && !currentDoc) li.classList.add('active');
                if (currentDoc && currentDoc.file === doc.file) li.classList.add('active');

                if (canDrag) {
                    li.draggable = true;
                    li.addEventListener('dragstart', handleDragStart);
                    li.addEventListener('dragover', handleDragOver);
                    li.addEventListener('dragleave', handleDragLeave);
                    li.addEventListener('drop', handleDrop);
                    li.addEventListener('dragend', handleDragEnd);
                }

                let titleHtml = doc.title;
                if (searchQuery) {
                    const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    titleHtml = titleHtml.replace(regex, '<mark style="background:var(--accent-glow);color:var(--accent)">$1</mark>');
                }

                li.innerHTML = `<div class="doc-item-title">${titleHtml}</div><div class="doc-item-meta">${formatTime(doc.mtime)}</div>`;
                li.onclick = () => {
                    document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    renderDoc(doc.file, doc.path);
                };
                frag.appendChild(li);
            }
            return frag;
        }

        function loadMoreDocs(isFullRender) {
            const docList = document.getElementById('docList');
            const end = Math.min(displayedCount + PAGE_SIZE, sortedDocs.length);
            const frag = buildDocItems(displayedCount, end);

            if (isFullRender) {
                docList.replaceChildren(frag);
            } else {
                docList.appendChild(frag);
            }

            displayedCount = end;
            document.getElementById('loadSentinel').style.display =
                displayedCount >= sortedDocs.length ? 'none' : '';
        }

        function setupLazyLoad() {
            if (lazyObserver) lazyObserver.disconnect();
            const sentinel = document.getElementById('loadSentinel');
            sentinel.style.display = displayedCount >= sortedDocs.length ? 'none' : '';
            lazyObserver = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && displayedCount < sortedDocs.length) {
                    loadMoreDocs();
                }
            }, { root: document.getElementById('sidebar'), threshold: 0.1 });
            lazyObserver.observe(sentinel);
        }

        // ── Drag and Drop (custom sort mode only) ──
        function handleDragStart(e) {
            dragSrcEl = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.file);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (this === dragSrcEl) return;
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
            const rect = this.getBoundingClientRect();
            this.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over-top', 'drag-over-bottom');
        }

        function handleDrop(e) {
            e.preventDefault();
            if (this === dragSrcEl) return;

            const dragFile = e.dataTransfer.getData('text/plain');
            const dropFile = this.dataset.file;
            const dragIdx = sortedDocs.findIndex(d => d.file === dragFile);
            if (dragIdx === -1) return;

            const [moved] = sortedDocs.splice(dragIdx, 1);
            const rect = this.getBoundingClientRect();
            let newIdx = sortedDocs.findIndex(d => d.file === dropFile);
            if (e.clientY >= rect.top + rect.height / 2) newIdx++;
            sortedDocs.splice(newIdx, 0, moved);

            saveCustomOrder(sortedDocs.map(d => d.file));
            displayedCount = 0;
            renderDocList();

            if (currentDoc) {
                document.querySelectorAll('.doc-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.file === currentDoc.file);
                });
            }
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
        }

        // ── Auth ──
        async function handleLogout() {
            try { await fetch('/api/logout', { method: 'POST' }); } catch {}
            window.location.href = '/login';
        }

        // ── Init ──
        async function init() {
            try {
                const meRes = await fetch('/api/me');
                const me = await meRes.json();
                if (me.authEnabled) document.getElementById('logoutBtn').style.display = '';
            } catch {}

            try {
                const res = await fetch('/api/docs');
                const list = await res.json();
                docConfig = list.map(d => ({ file: d.file, title: d.title, mtime: d.mtime, path: './' }));
            } catch (e) { console.error('Failed to load doc list:', e); }

            initSortBar();
            applySortAndRender();

            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            searchInput.addEventListener('input', e => {
                const v = e.target.value;
                searchClear.classList.toggle('visible', v.length > 0);
                filterDocs(v);
            });
            searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });

            if (sortedDocs.length > 0) {
                renderDoc(sortedDocs[0].file, sortedDocs[0].path);
            }
        }
        init();
    </script>
</body>
</html>
