<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>文档分享中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-deep: #080b10;
            --bg-surface: #0e1218;
            --bg-elevated: #151b24;
            --bg-hover: #1c2430;
            --border: rgba(99, 140, 255, 0.08);
            --border-active: rgba(99, 140, 255, 0.25);
            --accent: #638cff;
            --accent-glow: rgba(99, 140, 255, 0.15);
            --accent-dim: #3d5a9e;
            --text: #c8cfd8;
            --text-bright: #e8ecf0;
            --text-muted: #6b7a8d;
            --green: #34d399;
            --green-dim: #064e36;
            --sidebar-w: 280px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 140, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 140, 255, 0.3); }
        * { scrollbar-width: thin; scrollbar-color: rgba(99,140,255,0.15) transparent; }

        /* ── Layout ── */
        .container { display: flex; height: 100vh; position: relative; }

        /* ── Mobile hamburger ── */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
        }
        .menu-toggle:hover { border-color: var(--border-active); }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: width var(--transition), padding var(--transition), opacity var(--transition);
            flex-shrink: 0;
            position: relative;
        }

        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right-color: transparent;
        }

        /* ── Sidebar toggle (outside sidebar via container positioning) ── */
        .sidebar-toggle-wrap {
            position: absolute;
            top: 50%;
            left: var(--sidebar-w);
            transform: translateY(-50%);
            z-index: 20;
            transition: left var(--transition);
        }

        .sidebar-toggle-wrap.collapsed { left: 0; }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 48px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11px;
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            color: var(--accent);
            background: var(--bg-hover);
            border-color: var(--border-active);
        }

        .sidebar h1 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-bright);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar h1 span { color: var(--accent); }

        /* ── Search & Controls ── */
        .sidebar-controls {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 32px 8px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: none;
            transition: color 0.2s;
        }

        .search-clear.visible {
            display: block;
        }

        .search-clear:hover {
            color: var(--accent);
        }

        .refresh-btn {
            padding: 8px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            color: var(--accent);
        }

        .refresh-btn.loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .refresh-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .refresh-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        .doc-count {
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .doc-list { list-style: none; }

        .doc-item {
            padding: 10px 14px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            position: relative;
        }

        .doc-item:hover { background: var(--bg-hover); }

        .doc-item.active {
            background: var(--accent-glow);
            border-left-color: var(--accent);
        }

        .doc-item-title {
            font-weight: 500;
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-item.active .doc-item-title { color: var(--text-bright); }

        .doc-item-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Content ── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 48px 64px;
            background: var(--bg-deep);
            position: relative;
        }

        /* subtle gradient glow at top */
        .content::before {
            content: '';
            position: fixed;
            top: -120px;
            right: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99,140,255,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .markdown-body {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Typography ── */
        .markdown-body h1 {
            font-size: 2em;
            font-weight: 900;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 8px;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            position: relative;
        }
        .markdown-body h1::after {
            content: '';
            display: block;
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .markdown-body h2 {
            font-size: 1.5em;
            font-weight: 700;
            border-bottom: none;
            margin-top: 48px;
            margin-bottom: 16px;
            color: var(--text-bright);
            letter-spacing: -0.3px;
        }

        .markdown-body h3 {
            font-size: 1.15em;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .markdown-body h4 {
            font-size: 1em;
            font-weight: 500;
            margin-top: 24px;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.85em;
        }

        .markdown-body p { margin-bottom: 16px; color: var(--text); }

        .markdown-body strong { color: var(--text-bright); font-weight: 600; }

        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }

        /* ── Code ── */
        .markdown-body code {
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            background: var(--bg-elevated);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #a5d6ff;
            border: 1px solid var(--border);
        }

        .markdown-body pre {
            background: var(--bg-surface);
            padding: 20px 24px;
            border-radius: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: var(--text);
            border: none;
            font-size: 0.85em;
            line-height: 1.6;
        }

        /* ── Table ── */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            display: block;
            overflow-x: auto;
            border-radius: 8px;
        }

        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            min-width: 100px;
            font-size: 0.9em;
        }

        .markdown-body table th {
            background: var(--bg-elevated);
            font-weight: 600;
            color: var(--text-bright);
            text-align: left;
        }

        .markdown-body table tr:hover td {
            background: rgba(99, 140, 255, 0.03);
        }

        /* ── Lists ── */
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 28px;
        }
        .markdown-body li { margin-bottom: 6px; }
        .markdown-body li::marker { color: var(--accent-dim); }

        /* ── Blockquote ── */
        .markdown-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 12px 20px;
            color: var(--text-muted);
            margin-bottom: 16px;
            background: var(--accent-glow);
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* ── Download ── */
        .download-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .download-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .download-btn.visible { display: inline-flex; }
        .download-btn:hover { background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.35); }

        .download-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

        /* ── Overlay ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .sidebar-overlay.visible { display: block; }

        /* ── Loading ── */
        .loading {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loading::before {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Fade-in ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .markdown-body { animation: fadeUp 0.4s ease-out; }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }

            .sidebar-toggle-wrap { display: none !important; }

            .sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                width: 80% !important; max-width: 280px;
                padding: 20px !important;
                border-right: 1px solid var(--border) !important;
                overflow: auto !important;
            }
            .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.5); }

            .content { padding: 80px 16px 40px; }
            .markdown-body { font-size: 14px; }
            .markdown-body h1 { font-size: 1.6em; }
            .markdown-body h2 { font-size: 1.3em; }
            .markdown-body pre { padding: 14px; font-size: 12px; }
            .markdown-body table th, .markdown-body table td { padding: 6px 8px; font-size: 13px; min-width: 80px; }
            .download-btn { padding: 10px 18px; font-size: 15px; min-height: 44px; }
            .download-bar { justify-content: center; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 文档</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarOnMobile()"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <h1>
                <span>◆</span> 文档中心
                <span class="doc-count" id="docCount">0</span>
            </h1>

            <div class="sidebar-controls">
                <div class="search-box">
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="搜索文档..."
                        autocomplete="off"
                    >
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                </div>

                <button class="refresh-btn" id="refreshBtn" onclick="refreshDocs()">
                    <svg viewBox="0 0 16 16"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
                    刷新
                </button>
            </div>

            <ul class="doc-list" id="docList"></ul>
        </div>

        <div class="sidebar-toggle-wrap" id="sidebarToggleWrap">
            <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebarDesktop()" title="收起/展开侧边栏">◂</button>
        </div>

        <div class="content">
            <div class="download-bar">
                <button class="download-btn" id="downloadBtn" onclick="downloadCurrentDoc()">
                    <svg viewBox="0 0 16 16"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14H2.75Zm6-6.22 1.72-1.72a.749.749 0 1 1 1.06 1.06l-3 3a.749.749 0 0 1-1.06 0l-3-3a.749.749 0 1 1 1.06-1.06l1.72 1.72V1.75a.75.75 0 0 1 1.5 0v5.28Z"/></svg>
                    下载
                </button>
            </div>
            <div class="markdown-body">
                <div class="loading">加载中</div>
            </div>
        </div>
    </div>

    <script>
        let docConfig = [];
        let filteredDocs = [];
        const docs = {};
        let currentDoc = null;
        let searchQuery = '';

        function toggleSidebarDesktop() {
            const sidebar = document.getElementById('sidebar');
            const wrap = document.getElementById('sidebarToggleWrap');
            const toggle = document.getElementById('sidebarToggle');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            wrap.classList.toggle('collapsed', isCollapsed);
            toggle.textContent = isCollapsed ? '▸' : '◂';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', isOpen);
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('visible');
            }
        }

        async function loadMarkdown(filename, path) {
            if (!docs[filename]) {
                const response = await fetch(`${path}${filename}`);
                if (!response.ok) throw new Error('文件不存在');
                docs[filename] = await response.text();
            }
            return docs[filename];
        }

        async function renderDoc(filename, path) {
            const container = document.querySelector('.markdown-body');
            const downloadBtn = document.getElementById('downloadBtn');
            container.innerHTML = '<div class="loading">加载中</div>';
            downloadBtn.classList.remove('visible');
            try {
                const markdown = await loadMarkdown(filename, path);
                container.innerHTML = marked.parse(markdown);
                container.style.animation = 'none';
                container.offsetHeight; // reflow
                container.style.animation = '';
                currentDoc = { file: filename, path: path };
                downloadBtn.classList.add('visible');
                closeSidebarOnMobile();
                document.querySelector('.content').scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                container.innerHTML = `<p style="color: #f47067;">❌ ${error.message}</p>`;
                currentDoc = null;
            }
        }

        function downloadCurrentDoc() {
            if (!currentDoc || !docs[currentDoc.file]) return;
            const blob = new Blob([docs[currentDoc.file]], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentDoc.file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ── Search ──
        function filterDocs(query) {
            searchQuery = query.toLowerCase().trim();
            if (!searchQuery) {
                filteredDocs = [...docConfig];
            } else {
                filteredDocs = docConfig.filter(doc =>
                    doc.title.toLowerCase().includes(searchQuery) ||
                    doc.desc.toLowerCase().includes(searchQuery) ||
                    doc.file.toLowerCase().includes(searchQuery)
                );
            }
            updateDocList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('visible');
            filterDocs('');
        }

        function updateDocCount() {
            const count = document.getElementById('docCount');
            if (searchQuery) {
                count.textContent = `${filteredDocs.length}/${docConfig.length}`;
            } else {
                count.textContent = docConfig.length;
            }
        }

        // ── Refresh ──
        async function refreshDocs() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');

            try {
                const res = await fetch('/api/docs?t=' + Date.now());
                const list = await res.json();
                docConfig = list.map(d => ({ file: d.file, title: d.title, desc: d.desc, path: './' }));
                filterDocs(searchQuery);
                console.log('✓ Refreshed docs list');
            } catch (e) {
                console.error('Failed to refresh:', e);
            } finally {
                btn.classList.remove('loading');
            }
        }

        function updateDocList() {
            const docList = document.getElementById('docList');
            docList.innerHTML = '';

            if (filteredDocs.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;';
                empty.textContent = searchQuery ? '未找到匹配的文档' : '暂无文档';
                docList.appendChild(empty);
                updateDocCount();
                return;
            }

            filteredDocs.forEach((doc, i) => {
                const li = document.createElement('li');
                li.className = `doc-item${i === 0 && !currentDoc ? ' active' : ''}`;

                // Highlight search query
                let titleHtml = doc.title;
                let descHtml = doc.desc;
                if (searchQuery) {
                    const regex = new RegExp(`(${searchQuery})`, 'gi');
                    titleHtml = titleHtml.replace(regex, '<mark style="background: var(--accent-glow); color: var(--accent);">$1</mark>');
                    descHtml = descHtml.replace(regex, '<mark style="background: var(--accent-glow); color: var(--accent);">$1</mark>');
                }

                li.innerHTML = `<div class="doc-item-title">${titleHtml}</div><div class="doc-item-desc">${descHtml}</div>`;
                li.onclick = () => {
                    document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    renderDoc(doc.file, doc.path);
                };
                docList.appendChild(li);
            });

            updateDocCount();
        }

        function initDocList() {
            filteredDocs = [...docConfig];
            updateDocList();
        }

        async function init() {
            try {
                const res = await fetch('/api/docs');
                const list = await res.json();
                docConfig = list.map(d => ({ file: d.file, title: d.title, desc: d.desc, path: './' }));
            } catch (e) { console.error('Failed to load doc list:', e); }

            initDocList();

            // Search input handler
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');

            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                searchClear.classList.toggle('visible', value.length > 0);
                filterDocs(value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    clearSearch();
                }
            });

            // Auto-load first doc
            if (filteredDocs.length > 0) {
                renderDoc(filteredDocs[0].file, filteredDocs[0].path);
            }
        }
        init();
    </script>
</body>
</html>
